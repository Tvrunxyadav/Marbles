<!DOCTYPE html>
<html>
<head>
    <title>Marble Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Marble Guessing Game</h1>
    <p>Guess how many marbles are in the jar.</p>

    <div class="game">

        <div id="jar" class="jar"></div>

        <br>

        <input id="guess" type="number" placeholder="Enter guess">
        <button onclick="checkGuess()">Guess</button>

        <p id="result"></p>

    </div>

</body>
</html>
